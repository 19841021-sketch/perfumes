
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Música | Veloria Perfumes</title>
    <style>
        body {
            background: #35271f;
            color: #f8f1e7;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        button {
            background: #c6a875;
            color: #35271f;
            border: none;
            border-radius: 20px;
            padding: 10px 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h3>VELORIA PERFUMES</h3>
    <p>Música elegante</p>

    <audio id="musica" controls loop>
        <source src="./audio/Perfect (Instrumental) - Ed Sheeran - Instrumental Channel.mp3" type="audio/mpeg">
        Tu navegador no puede reproducir este audio.
    </audio>

    <script>
        const musica = document.getElementById("musica");

        musica.play().catch(() => {
            document.querySelector("p").textContent =
                "Presiona reproducir para escuchar la música.";
        });
    </script>
</body>
</html>
